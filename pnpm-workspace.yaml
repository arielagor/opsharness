packages:
  - apps/*
  - packages/*
  - evals
# pnpm 12 runs no dependency install scripts unless listed here.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: false
  'unrs-resolver': false
minimumReleaseAgeExclude:
  - '@langchain/langgraph-sdk@1.12.1'
  - '@langchain/langgraph@1.4.19'
