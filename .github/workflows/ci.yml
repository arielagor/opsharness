name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsharness
        # Same host port as docker-compose.yml, so the code's default DATABASE_URL works unchanged.
        ports:
          - 5547:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5547/opsharness
      OPSHARNESS_LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # v5 would auto-cache for the packageManager field before pnpm is installed.
          package-manager-cache: false
      - name: Install pnpm (version from package.json packageManager)
        run: npm install -g pnpm@12.9.1
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build (all packages + Next.js console)
        run: pnpm build
      - name: Migrate and seed (Prisma tables; LangGraph checkpoint tables are created on first use)
        run: pnpm db:migrate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Evals (deterministic, scripted model, no network)
        run: pnpm evals
      - name: Dependency audit (production, high and above)
        run: pnpm audit --prod --audit-level high

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks over the full history
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner -v
